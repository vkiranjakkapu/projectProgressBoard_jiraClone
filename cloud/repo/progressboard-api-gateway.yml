platform:
  security:
    cors:
      enabled: true

spring:
  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: progressboard-identity-service
              uri: lb://progressboard-identity-service
              predicates:
                - Path=/identity/**

            - id: progressboard-service
              uri: lb://progressboard-projects-service
              predicates:
                - Path=/projects/**
